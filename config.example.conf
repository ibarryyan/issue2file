# GitHub API令牌
gitHubToken = ""

# AI API令牌
aiToken = ""

# AI Model
aiModel = "deepseek-chat"

# AI Base URL
aiBaseURL = "https://api.deepseek.com/v1/chat/completions"

# 是否下载issue评论
commentEnable = true

# 是否使用AI分析issues
aiEnable = false

# 是否生成图表
chartEnable = true

# 是否生成可视化面板（dashboard.html + issues.json）
dashboardEnable = true

# 是否在导出后启动本地 Web 服务
serve = false

# 本地 Web 服务监听端口
port = 8080

# 是否把 Pull Request 也当作 issue 导出
includePR = false

# 指定输出目录
outputDir = "issues_output"

# AI分析总结文件名
summaryFile = "summary.md"
